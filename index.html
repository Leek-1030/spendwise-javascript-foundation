
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - JavaScript Foundation</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Smart Budget Management</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to SpendWise</h2>
            <p>Manage your monthly budget and track your expenses.</p>
            <button onclick="startBudget()">Start Budget Calculation</button>
        </section>

        <section class="results">
            <h2>Budget Information</h2>
            <p>Open your browser console to view your budget calculations.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SpendWise Budget Tracker</p>
    </footer>

</body>
</html>
